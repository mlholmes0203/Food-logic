<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike's Fast Food Picker</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
}

select, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
}

button {
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 8px;
}

.restaurant {
    font-size: 24px;
    font-weight: bold;
}

.order {
    margin-top: 15px;
    font-size: 18px;
}

.stats {
    margin-top: 15px;
}
</style>
</head>
<body>

<div class="card">

<h1>🍔 Mike's Fast Food Picker</h1>

<p>
Rules: Real food. No fries. No drinks. No apple slices.
Mostly 40g+ protein and roughly 650-900 calories.
</p>

<select id="restaurant">
    <option value="Anywhere">Anywhere</option>
    <option value="McDonald's">McDonald's</option>
    <option value="Whataburger">Whataburger</option>
    <option value="Wendy's">Wendy's</option>
    <option value="Burger King">Burger King</option>
    <option value="Chick-fil-A">Chick-fil-A</option>
    <option value="Sonic">Sonic</option>
</select>

<button onclick="randomMeal()">🎲 Random Meal</button>

<div id="result" class="card">
Hit Random Meal.
</div>

</div>

<script>

const meals = {

"McDonald's": [
{ name: "2 McDoubles", protein: 44, calories: 800 },
{ name: "McDouble + 10 Piece Nuggets", protein: 48, calories: 810 },
{ name: "Double Cheeseburger + McDouble", protein: 44, calories: 750 },
{ name: "2 Double Cheeseburgers", protein: 50, calories: 900 },
{ name: "Quarter Pounder with Cheese + McDouble", protein: 43, calories: 780 },
{ name: "Triple Cheeseburger + McDouble", protein: 50, calories: 860 },
{ name: "2 McDoubles + Extra Patty", protein: 55, calories: 890 }
],

"Whataburger": [
{ name: "Double Meat Whataburger (No Mayo, No Cheese)", protein: 48, calories: 760 },
{ name: "Sweet & Spicy Double (No Mayo)", protein: 45, calories: 850 },
{ name: "Triple Meat Whataburger (No Mayo, No Cheese)", protein: 60, calories: 900 },
{ name: "Patty Melt", protein: 43, calories: 900 },
{ name: "Mushroom Swiss Double", protein: 44, calories: 860 },
{ name: "Double Meat Jr + Double Meat Jr", protein: 46, calories: 800 },
{ name: "Double Meat Whataburger (No Mayo)", protein: 48, calories: 820 }
],

"Wendy's": [
{ name: "Dave's Double", protein: 49, calories: 860 },
{ name: "Dave's Double (No Mayo)", protein: 49, calories: 790 },
{ name: "2 Double Stacks", protein: 46, calories: 820 },
{ name: "Dave's Single + Double Stack", protein: 43, calories: 760 },
{ name: "Bacon Double Stack + Jr Cheeseburger Deluxe", protein: 42, calories: 780 },
{ name: "Baconator", protein: 57, calories: 960 },
{ name: "Dave's Triple", protein: 61, calories: 900 }
],

"Burger King": [
{ name: "Double Whopper (No Mayo)", protein: 42, calories: 850 },
{ name: "2 Double Cheeseburgers", protein: 48, calories: 780 },
{ name: "Whopper + Double Cheeseburger", protein: 47, calories: 890 },
{ name: "Texas Double Whopper (No Mayo)", protein: 50, calories: 900 },
{ name: "2 Bacon Double Cheeseburgers", protein: 50, calories: 850 },
{ name: "Bacon Double Cheeseburger + Double Cheeseburger", protein: 45, calories: 810 }
],

"Chick-fil-A": [
{ name: "Chicken Sandwich + 8 Count Grilled Nuggets", protein: 50, calories: 730 },
{ name: "Spicy Chicken Sandwich + 8 Count Nuggets", protein: 45, calories: 790 },
{ name: "12 Count Grilled Nuggets + Chicken Sandwich", protein: 55, calories: 700 },
{ name: "Chicken Sandwich + 12 Count Nuggets", protein: 50, calories: 830 },
{ name: "Spicy Deluxe + 8 Count Grilled Nuggets", protein: 47, calories: 760 },
{ name: "2 Chicken Sandwiches", protein: 56, calories: 880 },
{ name: "Grilled Club + 8 Count Nuggets", protein: 48, calories: 760 }
],

"Sonic": [
{ name: "SuperSONIC Double Cheeseburger (No Mayo)", protein: 45, calories: 820 },
{ name: "Double SONIC Smasher", protein: 40, calories: 850 },
{ name: "Quarter Pound Double Cheeseburger + Jr Burger", protein: 43, calories: 790 },
{ name: "SuperSONIC Double Cheeseburger + Jr Cheeseburger", protein: 50, calories: 900 },
{ name: "Garlic Butter Bacon Cheeseburger", protein: 44, calories: 890 },
{ name: "2 Quarter Pound Double Cheeseburgers", protein: 54, calories: 880 }
]

};

function randomMeal() {

    const selected =
    document.getElementById("restaurant").value;

    let choices = [];

    if (selected === "Anywhere") {

        for (let restaurant in meals) {

            meals[restaurant].forEach(meal => {

                choices.push({
                    restaurant,
                    ...meal
                });

            });

        }

    } else {

        choices = meals[selected].map(meal => ({
            restaurant: selected,
            ...meal
        }));

    }

    const pick =
    choices[Math.floor(Math.random() * choices.length)];

    document.getElementById("result").innerHTML = `
        <div class="restaurant">
        🍔 ${pick.restaurant}
        </div>

        <div class="order">
        ${pick.name}
        </div>

        <div class="stats">
        💪 Protein: <strong>${pick.protein}g</strong><br><br>
        🔥 Calories: <strong>${pick.calories}</strong>
        </div>
    `;
}

</script>

</body>
</html>
